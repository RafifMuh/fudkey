<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bumper</title>
    <link rel="modulepreload" href="http://localhost/build/assets/app-l0sNRNKZ.js" /><link rel="modulepreload" href="http://localhost/build/assets/app-CAiCLEjY.js" /><script type="module" src="http://localhost/build/assets/app-l0sNRNKZ.js"></script><script type="module" src="http://localhost/build/assets/app-CAiCLEjY.js"></script>    <style>
        @font-face {
            font-family: 'Gantari';
            src: url('/Gantari/Gantari-VariableFont_wght.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Gantari';
            src: url('/Gantari/Gantari-Italic-VariableFont_wght.ttf') format('truetype');
            font-weight: 100 900;
            font-style: italic;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        :root {
            --white: #ffffff;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background-color: #2c2c2c;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Gantari', sans-serif;
            letter-spacing: -0.06em;
            overflow: hidden;
        }

        .slide-container {
            width: 100%;
            max-width: 390px;
            height: 844px;
            background-image: url('/images/bg-bumper.png');
            background-size: 390px 844px;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--white);
            padding: 40px 24px 44px;
            position: relative;
            transition: transform 0.5s ease;
        }

        .headline-subtitle {
            margin-top: 14px;
            font-size: 14px;
            line-height: 1.35;
            font-weight: 500;
        }

        .cta-link {
            position: absolute;
            bottom: 56px;
            left: 50%;
            transform: translateX(-50%);
            width: 72px;
            height: 72px;
            border-radius: 16px;
            text-indent: -9999px;
        }

        .slide-container.is-sliding {
            transform: translateY(-100%);
        }

        @media (max-width: 430px) {
            .slide-container {
                max-width: 100%;
            }
        }

        .hero-title {
            font-family: 'Gantari', sans-serif;
            font-size: 44px;
            text-align: center;
            line-height: 1.034;
            margin-bottom: 20px;
            color: var(--white);
            letter-spacing: -0.06em;
        }

        .hero-title .bold {
            font-weight: 1000;
        }

        .hero-title .thin {
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="headline">
            <h1 class="hero-title">
            <span class="bold">WEL</span><span class="thin">COME</span><br><span class="bold">T</span><span class="thin">O</span> <span class="thin">T</span><span class="bold">HE</span><br>
            <span class="thin">FUD</span><span class="bold">KEY</span> <span class="bold">CL</span><span class="thin">UB</span>
            </h1>
            <div class="headline-subtitle">
                Kami Mulai dari yang Sederhana karena<br>
                Setiap Rasa ada Cerita
            </div>
        </div>
        <a class="cta-link" href="/home">Ke Home</a>
    </div>
    <script>
        const ctaLink = document.querySelector('.cta-link');
        const container = document.querySelector('.slide-container');

        if (ctaLink && container) {
            ctaLink.addEventListener('click', (event) => {
                event.preventDefault();
                container.classList.add('is-sliding');
                setTimeout(() => {
                    window.location.href = '/home';
                }, 500);
            });
        }
    </script>
</body>
</html>
